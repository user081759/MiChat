<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en vivo</title>

    <!-- Firebase compat scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        :root {
            --fondo: #121212;
            --superficie: #1a1a23;
            --texto: #e8e8f0;
            --texto-suave: #a0a0b8;
            --acento: #7c5cff;
            --borde: #2a2a3a;
            --radio: 12px;
            --fuente: 'Segoe UI', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--fuente);
            background: var(--fondo);
            color: var(--texto);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .nombre-usuario {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--superficie);
            border: 1px solid var(--borde);
            color: var(--texto);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 2500;
            display: none;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .nombre-usuario.mostrar {
            display: block;
        }

        .menu-lateral {
            position: fixed;
            top: 0;
            left: -260px;
            width: 250px;
            height: 100%;
            background: var(--superficie);
            border-right: 1px solid var(--borde);
            padding: 20px;
            transition: left 0.3s;
            z-index: 2000;
            overflow-y: auto;
        }

        .menu-lateral.abierto {
            left: 0;
        }

        .menu-lateral h3 {
            color: var(--acento);
            margin-bottom: 15px;
            text-align: center;
        }

        .lista-usuarios {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .usuario-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(124, 92, 255, 0.1);
            border: 1px solid var(--borde);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.9rem;
        }

        .usuario-item.seleccionado {
            border-color: var(--acento);
            background: rgba(124, 92, 255, 0.25);
        }

        .btn-seleccionar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--acento);
            background: transparent;
            color: var(--acento);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-seleccionar.seleccionado {
            background: var(--acento);
            color: #fff;
        }

        .btn-seleccionar::after {
            content: "✓";
            display: none;
        }

        .btn-seleccionar.seleccionado::after {
            display: block;
        }

        .btn-cerrar-menu {
            background: none;
            border: none;
            color: var(--texto-suave);
            font-size: 1.5rem;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .overlay-menu {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1500;
        }

        .overlay-menu.activo {
            display: block;
        }

        .btn-menu {
            position: fixed;
            top: 15px;
            left: 15px;
            background: var(--superficie);
            border: 1px solid var(--borde);
            color: var(--texto);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 2500;
        }
        .btn-menu.oculto {
            display: none !important;
        }

        .btn-ver-privados {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            background: transparent;
            border: 1px solid var(--borde);
            color: var(--texto);
            padding: 10px;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .btn-ver-privados:hover {
            background: rgba(124, 92, 255, 0.1);
            border-color: var(--acento);
        }

        .badge-privados {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            background: var(--acento);
            color: #fff;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0 4px;
        }

        .contenedor-chat {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 0;
            padding: 20px;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 0;
        }

        h1, h2, h3 {
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--acento);
        }

        .area-mensajes {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mensaje {
            margin-bottom: 6px;
            background: rgba(124, 92, 255, 0.1);
            border-left: 3px solid var(--acento);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .mensaje-contenido {
            display: block;
            width: 100%;
        }

        .mensaje-cabecera {
            display: block;
            width: 100%;
            margin-bottom: 4px;
        }

        .admin-etiqueta {
            display: block;
            color: #00c853;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .texto-admin {
            color: inherit;
        }

        .btn-descargar-mensaje {
            background: none;
            border: none;
            color: #4da6ff;
            cursor: pointer;
            font-size: 0.8rem;
            align-self: flex-end;
            margin-top: 3px;
            text-decoration: none;
        }

        .btn-descargar-mensaje:hover {
            text-decoration: underline;
        }

        .audio-mensaje-wrap {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: min(100%, 420px);
            margin-top: 6px;
        }
        .audio-mensaje {
            display: block;
            width: 100%;
        }
        .audio-duracion {
            font-size: 12px;
            opacity: .85;
            margin-left: 4px;
        }
        .audio-reproductor {
            display:flex;
            align-items:center;
            gap:8px;
            width:min(100%,420px);
            margin-top:6px;
            background: #f5f5f5;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            padding: 6px 10px 6px 6px;
            min-height: 42px;
            box-shadow: 0 1px 3px rgba(0,0,0,.15);
        }
        .audio-reproductor audio { display:none; }
        .audio-play {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #222;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 0;
            padding: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,.2);
        }
        .audio-play-icon {
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 7px 0 7px 12px;
            border-color: transparent transparent transparent #222;
            margin-left: 3px;
        }
        .audio-reproductor.reproduciendo .audio-play-icon {
            width: 10px;
            height: 12px;
            border: none;
            background: linear-gradient(to right, #222 0 3px, transparent 3px 7px, #222 7px 10px);
            margin-left: 0;
        }
        .audio-tiempos { color: #555 !important; }
        .audio-progreso {
            background: #c8c8c8 !important;
        }
        .audio-progreso::-webkit-slider-thumb {
            background: #555 !important;
        }
        .audio-progreso::-moz-range-thumb {
            background: #555 !important;
        }
        .audio-carga {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,0,0,.2);
            border-top-color: #222;
            border-radius: 50%;
            animation: audio-spin .7s linear infinite;
        }
        .audio-reproductor.cargando .audio-play-icon { display: none; }
        .audio-reproductor.cargando .audio-carga { display: block; }
        .audio-reproductor.cargando .audio-play { pointer-events: none; }
        @keyframes audio-spin { to { transform: rotate(360deg); } }
        .audio-cuerpo {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .audio-progreso {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #5c5c5c;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .audio-progreso::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e8e8e8;
            border: 0;
            cursor: pointer;
        }
        .audio-progreso::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e8e8e8;
            border: 0;
            cursor: pointer;
        }
        .audio-tiempos {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #bdbdbd;
            font-variant-numeric: tabular-nums;
        }
        .audio-duracion-fija { display:none; }
        @keyframes parpadeo-colores {
            0% { color:#ff1744; }
            16% { color:#ff9100; }
            33% { color:#ffea00; }
            50% { color:#00e676; }
            66% { color:#00b0ff; }
            83% { color:#d500f9; }
            100% { color:#ff1744; }
        }
        .texto-parpadeo {
            animation: parpadeo-colores 0.28s linear infinite;
        }
        .aviso-sin-conexion {
            display: none;
            margin: 8px 0;
            color: #ff8a80;
            font-size: 0.9rem;
        }
        .mensaje-enviando {
            opacity: .75;
            font-style: italic;
            color: var(--texto-suave);
        }
        .perfil-stats {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 14px 0 8px;
        }
        .perfil-stat {
            background: none;
            border: 0;
            color: var(--texto);
            cursor: pointer;
            text-align: center;
        }
        .perfil-stat strong { display:block; font-size:1.05rem; color:#fff; }
        .perfil-stat span { font-size:.78rem; color:var(--texto-suave); }
        .lista-seguimiento {
            max-height: 220px;
            overflow-y: auto;
            text-align: left;
            margin-top: 10px;
            display: none;
        }
        .lista-seguimiento.mostrar { display:block; }
        .item-seguimiento {
            padding: 8px 6px;
            border-bottom: 1px solid var(--borde);
            font-size: .9rem;
        }

        .mensaje-texto {
            flex: 1;
            white-space: normal;
        }

        .texto-mensaje {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .mensaje-imagen {
            display: block;
            width: auto;
            max-width: 100%;
            max-height: 520px;
            height: auto;
            border-radius: 8px;
            margin-top: 8px;
            object-fit: contain;
        }

        .mensaje-imagen-contenedor {
            width: 100%;
            margin-top: 2px;
        }

        .mensaje strong {
            color: var(--acento);
        }

        .mensaje .fecha {
            font-size: 0.7rem;
            color: var(--texto-suave);
            margin-left: 8px;
            opacity: 0.7;
        }

        .btn-eliminar-mensaje {
            background: none;
            border: none;
            color: #f44336;
            cursor: pointer;
            font-size: 0.8rem;
            align-self: flex-end;
            margin-top: 3px;
        }

        .btn-eliminar-mensaje:hover {
            text-decoration: underline;
        }

        .indicador-estado {
            font-size: 0.8rem;
            margin-left: 5px;
            color: var(--texto-suave);
        }

        .indicador-estado.leido {
            color: #4da6ff;
        }

        .mensaje-eliminado {
            color: #000;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .mensaje-eliminado::before {
            content: "❌";
            color: #f44336;
        }

        .mensaje-cita {
            background: #ffffff;
            color: #111111;
            border: 1px solid #ffffff;
            border-left: 3px solid #ffffff;
            padding: 5px 8px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            border-radius: 4px;
        }

        .mensaje-cita .autor-cita {
            font-weight: bold;
            color: var(--acento);
        }
        .mensaje-cita .texto-cita {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .banner-respuesta {
            background: rgba(124, 92, 255, 0.2);
            border: 1px solid var(--acento);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner-respuesta span {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-cancelar-respuesta {
            background: none;
            border: none;
            color: #f44336;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-responder-mensaje {
            background: none;
            border: none;
            color: var(--acento);
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 3px;
            align-self: flex-end;
        }

        .btn-responder-mensaje:hover {
            text-decoration: underline;
        }

        .formulario-chat {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
        }

        .fila-input {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .fila-input input[type="text"] {
            flex: 1;
            padding: 12px;
            background: var(--fondo);
            border: 1px solid var(--borde);
            border-radius: 20px;
            color: var(--texto);
            font-size: 1rem;
            font-family: var(--fuente);
            width: 100%;
        }

        .fila-input input[type="text"]:focus {
            outline: none;
            border-color: var(--acento);
        }

        .btn-enviar {
            background: var(--acento);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-enviar:hover {
            background: #9d7bff;
        }

        .btn-imagen {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0 5px;
        }

        /* Clase para ocultar inputs sin display:none */
        .input-oculto {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 0;
            height: 0;
            opacity: 0;
        }

        /* Selector de imagen */
        .modal-selector-imagen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 4000;
            align-items: center;
            justify-content: center;
        }

        .modal-selector-imagen.mostrar {
            display: flex;
        }

        .selector-contenido {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            padding: 20px;
            width: 90%;
            max-width: 300px;
            text-align: center;
        }

        .selector-opciones {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .opcion-imagen {
            background: none;
            border: 1px solid var(--borde);
            color: var(--texto);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .opcion-imagen:hover {
            background: rgba(124, 92, 255, 0.1);
            border-color: var(--acento);
        }

        .btn-cerrar-selector {
            background: none;
            border: none;
            color: var(--texto-suave);
            font-size: 1.5rem;
            cursor: pointer;
            align-self: flex-end;
        }

        .modal-privados {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            z-index: 3000;
        }

        .modal-privados.mostrar {
            display: flex;
        }

        .modal-privados-contenido {
            background: var(--superficie);
            border: none;
            border-radius: 0;
            padding: 20px;
            width: 100%;
            height: 100%;
            max-width: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-privados h3 {
            color: var(--acento);
        }

        .area-privados {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mensaje-privado {
            margin-bottom: 8px;
            background: rgba(255, 215, 0, 0.1);
            border-left: 3px solid #ffc107;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .mensaje-privado .fecha {
            font-size: 0.65rem;
            opacity: 0.5;
            margin-left: 5px;
        }

        .mensaje-privado strong {
            color: var(--acento);
        }

        .mensaje-privado .admin-etiqueta {
            margin-bottom: 2px;
        }

        .btn-cerrar-privados {
            background: none;
            border: none;
            color: var(--texto-suave);
            font-size: 1.5rem;
            cursor: pointer;
            align-self: flex-end;
        }

        .modal-nombre {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .modal-nombre-contenido {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            padding: 25px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-nombre-contenido input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: var(--fondo);
            border: 1px solid var(--borde);
            border-radius: 20px;
            color: var(--texto);
            font-size: 1rem;
        }

        .modal-nombre-contenido input:focus {
            outline: none;
            border-color: var(--acento);
        }

        .modal-nombre-contenido .btn-enviar {
            margin-top: 10px;
        }

        .link-nueva-cuenta {
            display: block;
            margin-top: 10px;
            color: var(--acento);
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.85rem;
        }

        .checkbox-mostrar-password {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--texto-suave);
            font-size: 0.85rem;
            margin: 10px 0;
        }

        .checkbox-mostrar-password input {
            width: auto;
            margin: 0;
        }

        .texto-mensaje a, .texto-cita a {
            color: #4da6ff;
            text-decoration: underline;
            word-break: break-all;
        }
    
.btn-ver-perfil{background:none;border:0;color:#fff;cursor:pointer;padding:2px 4px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;}
.cabecera-identidad{display:flex;align-items:center;gap:6px;}
.cabecera-identidad>span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;}
.admin-etiqueta{display:block;text-align:left;}
#select-nombre{width:100%;padding:10px;border-radius:6px;background:var(--superficie);color:var(--texto);border:1px solid var(--borde);margin-bottom:8px;}
</style>
<style>
.foto-perfil-mensaje{width:36px;height:36px;min-width:36px;border-radius:50%;object-fit:cover;cursor:pointer;vertical-align:middle;margin-right:7px;}
.cabecera-identidad{display:inline-flex;align-items:center;gap:0;}
.admin-etiqueta{display:block;text-align:center;line-height:1.05;}
.modal-foto-perfil{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:5000;}
.modal-foto-perfil.mostrar{display:flex;}

async function contarSeguimiento(usuario){
  const min=(usuario.nombreMin||usuario.nombre||"").toLowerCase();
  const siguiendo=Array.isArray(usuario.siguiendo)?usuario.siguiendo:[];
  let seguidores=Array.isArray(usuario.seguidores)?usuario.seguidores.length:0;
  if(!Array.isArray(usuario.seguidores)){
    try{
      const snap=await db.collection("usuarios").where("siguiendo","array-contains",min).get();
      seguidores=snap.size;
    }catch(_){ seguidores=0; }
  }
  return { seguidores, siguiendo: siguiendo.length, listaSiguiendo: siguiendo, listaSeguidores: usuario.seguidores||[] };
}

  if(tipo==="siguiendo"){
    ids=Array.isArray(perfilUsuarioSeleccionado.siguiendo)?perfilUsuarioSeleccionado.siguiendo.slice():[];
  } else {
    if(Array.isArray(perfilUsuarioSeleccionado.seguidores) && perfilUsuarioSeleccionado.seguidores.length){
      ids=perfilUsuarioSeleccionado.seguidores.slice();
    } else {
      try{
        const snap=await db.collection("usuarios").where("siguiendo","array-contains",min).get();
        ids=[]; snap.forEach(d=>ids.push(d.data().nombre||d.id));
      }catch(_){ ids=[]; }
    }
  }
  if(!ids.length){
    listaSeguimiento.innerHTML=`<p style="color:var(--texto-suave);text-align:center">${tipo==="siguiendo"?"No sigue a nadie.":"Sin seguidores."}</p>`;
    return;
  }

    item.className="item-seguimiento";
    item.textContent=id;
    listaSeguimiento.appendChild(item);
  }
}

                if (snap.empty) throw new Error("cache vacía");
            } catch (_) {
                snap = await db.collection("usuarios").get();

        return Date.now().toString(36) + Math.random().toString(36).substr(2);

    async function verificarUsuario(nombre) {
        const nombreMin = nombre.toLowerCase().trim();
        if (!nombreMin) return null;
        try {
            const doc = await db.collection("usuarios").doc(nombreMin).get();
            return doc.exists ? { ...doc.data(), id: doc.id } : null;
        } catch (error) {
            console.error("Error al verificar usuario:", error);
            const msg = String(error && error.message ? error.message : error || "");
            if (!navigator.onLine || /offline|client is offline|failed to get document|unavailable|network/i.test(msg)) {
                return { __sinConexion: true };
            }
            return null;
        }
    }

        const textoOriginalBoton=btnEntrar.textContent;

        try {

        if (!nombre || !password) {
            alert("Escribe nombre y contraseña.");
            return;
        }

        const nombreMin = nombre.toLowerCase().trim();
        const usuarioExistente = await verificarUsuario(nombre);

        if (modoCreacion) {
            if (usuarioExistente) {
                alert("Ese usuario ya existe. Inicie sesión.");
                return;
            }

            const registroEliminado = await db.collection("cuentasEliminadas").doc(nombreMin).get();
            const nuevoToken = generarToken();
            const datosNuevaCuenta = {
                nombre,
                password,
                tokenSesion: nuevoToken,
                nombreMin,
                creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
                puedeEnviarDesde: registroEliminado.exists
                    ? new Date(Date.now() + ESPERA_NUEVA_CUENTA_MS).toISOString()
                    : null,
                congeladoHasta: null,
                administrador: false,
                siguiendo: [],
                seguidores: []
            };

            await db.collection("usuarios").doc(nombreMin).set(datosNuevaCuenta);
            // La espera pertenece únicamente a esta recreación de la cuenta eliminada.
            // Consumimos el registro para que otras cuentas no resulten afectadas y
            // para que una futura recreación de este mismo nombre no herede otra espera.
            if (registroEliminado.exists) {
                await db.collection("cuentasEliminadas").doc(nombreMin).delete();
            }
            nombreUsuario = nombre;
            sessionToken = nuevoToken;

        if (usuarioExistente) {

                iniciarPresencia();
                iniciarChat();
            } else {
                alert("Contraseña incorrecta. Vuelva a intentarlo o cree una cuenta.");
            }
        } else {
            alert("Usuario no encontrado. Cree una cuenta nueva.");
        }
        } catch(error) {
            console.error(error);
            const msg = String(error && error.message ? error.message : error || "");
            const offline = !navigator.onLine || /offline|client is offline|Failed to get document|unavailable|network/i.test(msg);
            if (modoCreacion && offline) {

            }
        } finally {
            btnEntrar.disabled=false;
            btnEntrar.textContent=modoCreacion?"Crear cuenta":textoOriginalBoton;
        }
    });

function vigilarSesionActual() {
        if (!nombreUsuario || !sessionToken) return;
        const nombreMin = nombreUsuario.toLowerCase().trim();
        db.collection("usuarios").doc(nombreMin).onSnapshot(async function(doc) {
            if (doc.exists) {
                const data = doc.data();
                esAdministrador=data.administrador===true; if(data.fotoPerfil){localStorage.setItem("chat_fotoPerfil",data.fotoPerfil);perfilesUsuarios[nombreMin]=data.fotoPerfil;} mostrarNombreUsuario();
                if (data.tokenSesion !== sessionToken) {
                    alert("Tu cuenta ha sido abierta en otro dispositivo. Se cerrará esta sesión.");
                    localStorage.removeItem("chat_nombre");
                    localStorage.removeItem("chat_token");
                    nombreUsuario = "";
                    mostrarNombreUsuario();
                    location.reload();
                }
            } else {
                // Una lectura vacía mientras el dispositivo está sin conexión no significa que la cuenta haya sido eliminada.
                if (!navigator.onLine) return;
                try {
                    const servidor = await db.collection("usuarios").doc(nombreMin).get({source:"server"});
                    if (servidor.exists) return;
                } catch (_) { return; }
                usuarioEliminadoDetectado = true;
                alert("Tu cuenta ha sido eliminada. Debes crear una nueva cuenta o iniciar sesión con otra cuenta.");
                localStorage.removeItem("chat_nombre");
                localStorage.removeItem("chat_token");
                nombreUsuario = "";
                sessionToken = null;
                mostrarNombreUsuario();
                location.reload();
            }
        });
    }

    async function limpiarMensajesDiarios(){
  if(!esAdministrador)return;
  try{
    const ahora=new Date(); const limite=new Date(ahora.getFullYear(),ahora.getMonth(),ahora.getDate());
    const ts=firebase.firestore.Timestamp.fromDate(limite);
    const [chatSnap,privSnap]=await Promise.all([db.collection("chat").where("fecha","<",ts).get(),db.collection("privados").where("fecha","<",ts).get()]);
    const urls=[]; const refs=[];
    chatSnap.forEach(d=>{const m=d.data();refs.push(d.ref);if(m.url&&m.tipo!=="imagen")urls.push(m.url)});
    privSnap.forEach(d=>{const m=d.data();refs.push(d.ref);if(m.url&&m.tipo!=="imagen")urls.push(m.url)});
    for(let i=0;i<refs.length;i+=450){const b=db.batch();refs.slice(i,i+450).forEach(r=>b.delete(r));await b.commit();}
    for(const url of urls){try{await storage.refFromURL(url).delete()}catch(e){}}
  }catch(e){console.warn("Limpieza diaria no disponible:",e.message)}
}
function programarLimpiezaDiaria(){
  const ejecutar=()=>{limpiarMensajesDiarios(); const n=new Date(); const siguiente=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1); setTimeout(ejecutar,siguiente-n+1000)};
  ejecutar();
}

function iniciarPresencia(){
        actualizarEstadoEnLinea(true);
        setInterval(()=>actualizarEstadoEnLinea(navigator.onLine),15000);
        window.addEventListener("online",()=>actualizarEstadoEnLinea(true));
        window.addEventListener("offline",()=>actualizarEstadoEnLinea(false));
        window.addEventListener("pagehide",()=>{try{navigator.sendBeacon&&navigator.sendBeacon("data:,","")}catch(_){}; actualizarEstadoEnLinea(false);});

async function convertirImagenParaChat(file) {
    if (!file || !file.type.startsWith("image/")) {
        throw new Error("El archivo seleccionado no es una imagen.");
    }

    const maxDimension = 1280;
    const maxBytes = 700 * 1024;

    const dataUrl = await new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.onload = () => resolve(lector.result);
        lector.onerror = () => reject(new Error("No se pudo leer la imagen."));
        lector.readAsDataURL(file);
    });

    const imagen = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("No se pudo procesar la imagen."));
        img.src = dataUrl;
    });

    let ancho = imagen.naturalWidth;
    let alto = imagen.naturalHeight;
    const escala = Math.min(1, maxDimension / Math.max(ancho, alto));
    ancho = Math.max(1, Math.round(ancho * escala));
    alto = Math.max(1, Math.round(alto * escala));

    const canvas = document.createElement("canvas");
    canvas.width = ancho;
    canvas.height = alto;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(imagen, 0, 0, ancho, alto);

    let calidad = 0.82;
    let resultado = canvas.toDataURL("image/jpeg", calidad);

    while (resultado.length > maxBytes * 1.37 && calidad > 0.45) {
        calidad -= 0.07;
        resultado = canvas.toDataURL("image/jpeg", calidad);
    }

    if (resultado.length > maxBytes * 1.37) {
        throw new Error("La imagen es demasiado grande para enviarla.");
    }

    return resultado;
}

async function blobComoDataURL(blob){return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});}
async function obtenerDuracionAudio(file){
  return await new Promise((resolve)=>{
    const url=URL.createObjectURL(file);
    const audio=document.createElement("audio");
    let terminado=false;
    const limpiar=(valor)=>{if(terminado)return;terminado=true;URL.revokeObjectURL(url);resolve(Number.isFinite(valor)?valor:0)};
    audio.preload="metadata";
    audio.onloadedmetadata=()=>limpiar(audio.duration);
    audio.onerror=()=>limpiar(0);
    audio.src=url;
    setTimeout(()=>limpiar(audio.duration),5000);
  });
}

async function subirAudio(file, privado=false, duracionGrabada=null){
  if(!file || !file.size) throw new Error("La grabación está vacía.");
  if(!(await verificarPuedeEnviar())) throw new Error("No puedes enviar mensajes en este momento.");
  if(privado && !usuarioSeleccionado) throw new Error("Selecciona un usuario.");

  const tipoMime=file.type || "audio/webm";
  let duracion=Number(duracionGrabada);
  if(!Number.isFinite(duracion) || duracion<=0){
    duracion=await obtenerDuracionAudio(file);
  }
  duracion=Math.max(0,Math.round(duracion*10)/10);
  const base={
    tipo:"audio", mimeType:tipoMime, duracion, eliminado:false,
    administrador:esAdministrador,
    colorTexto:esAdministrador?colorTextoAdmin:"inherit",
    fotoPerfil:localStorage.getItem("chat_fotoPerfil")||"",
    fecha:firebase.firestore.FieldValue.serverTimestamp()
  };
  if(privado){
    base.de=nombreUsuario; base.deMin=nombreUsuario.toLowerCase();
    base.para=usuarioSeleccionado; base.paraMin=usuarioSeleccionado.toLowerCase();
    base.leido=false; base.entregado=false;
  }else{
    base.nombre=nombreUsuario; base.nombreMin=nombreUsuario.toLowerCase();
  }

  // Para que una grabación corta no dependa de Firebase Storage, primero
  // la convertimos a data URL y la guardamos directamente junto al mensaje.
  // Esto evita que un bloqueo de las reglas de Storage impida enviar audio.
  if(privado) mostrarEnviandoPrivado();
  try {
  if(file.size <= 500000){
    const dataUrl=await blobComoDataURL(file);
    if(!dataUrl || dataUrl.length > 950000) throw new Error("La grabación es demasiado grande para enviarla directamente.");
    base.url=dataUrl;
    if(privado) await db.collection("privados").add(base);
    else await db.collection("chat").add(base);
    if(privado) await cargarMensajesPrivados();
    return true;
  }

  // Grabaciones grandes: Firebase Storage.
  const ext=tipoMime.includes("ogg")?"ogg":tipoMime.includes("mp4")?"mp4":tipoMime.includes("mpeg")?"mp3":"webm";
  const ruta=`audios/${nombreUsuario.toLowerCase()}_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const ref=storage.ref().child(ruta);
  await ref.put(file,{contentType:tipoMime,cacheControl:"public,max-age=31536000"});
  base.url=await ref.getDownloadURL();
  if(privado) await db.collection("privados").add(base);
  else await db.collection("chat").add(base);
  if(privado) await cargarMensajesPrivados();
  return true;
  } finally {
    if(privado) quitarEnviandoPrivado();
  }
}

async function iniciarGrabacion(privado=false){

      estado.recorder.pause();
      boton.textContent="▶️";
    }else if(estado.recorder.state==="paused"){
      if(estado.pausaInicioMs) estado.pausaAcumuladaMs += Date.now()-estado.pausaInicioMs;
      estado.pausaInicioMs=0;
      estado.recorder.resume();
      boton.textContent="⏸️";
    }
    return;
  }

  if(!(await verificarPuedeEnviar())) return;
  if(privado&&!usuarioSeleccionado){alert("Selecciona un usuario.");return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
    alert("Este navegador no permite grabar audio.");return;
  }

  let stream=null;
  try{
    const intentosAudio=[
      {audio:true},
      {audio:{echoCancellation:true,noiseSuppression:true}},
      {audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}}
    ];
    let ultimoError=null;
    for (const constraints of intentosAudio) {
      try {
        stream=await navigator.mediaDevices.getUserMedia(constraints);
        if (stream) break;
      } catch (errMic) {
        ultimoError=errMic;
        stream=null;
      }
    }
    if (!stream) {
      throw ultimoError || new Error("Could not start audio source");
    }

    const candidatos=[
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus",
      "audio/ogg",
      "audio/mp4",
      "audio/aac"
    ];
    const mime=candidatos.find(x=>MediaRecorder.isTypeSupported(x))||"";
    let recorder;
    try {
      recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    } catch (errRec) {
      recorder=new MediaRecorder(stream);
    }
    const partes=[];

    const terminado=new Promise((resolve,reject)=>{
      let finalizado=false;
      recorder.ondataavailable=e=>{
        if(e.data && e.data.size) partes.push(e.data);
      };
      recorder.onerror=e=>reject(e.error||new Error("Error de MediaRecorder"));
      recorder.onstop=()=>{
        if(!finalizado){
          finalizado=true;
          resolve();
        }
      };
    });

    const st={
      recorder,partes,stream,terminado,boton,mimeType:mime||recorder.mimeType,
      inicioMs:Date.now(), pausaInicioMs:0, pausaAcumuladaMs:0
    };
    setEstado(privado,st);

    recorder.start(250);
    boton.textContent="⏸️";
    boton.classList.add("grabando");
  }catch(e){
    stream?.getTracks?.().forEach(t=>t.stop());
    alert("No se pudo acceder al micrófono: "+(e.message||e));
  }
}

async function enviarGrabacion(privado=false){
  const e=estadoGrabacion(privado);
  if(!e) return false;

  try{
    if(e.recorder.state==="paused"){
      if(e.pausaInicioMs) e.pausaAcumuladaMs += Date.now()-e.pausaInicioMs;
      e.pausaInicioMs=0;
      e.recorder.resume();
    }

    if(e.recorder.state!=="inactive"){
      try{ e.recorder.requestData(); }catch(_){}
      e.recorder.stop();
    }

    await e.terminado;

    e.stream.getTracks().forEach(t=>t.stop());

    const tipo=e.recorder.mimeType||e.mimeType||"audio/webm";
    const ext=tipo.includes("ogg")?"ogg":tipo.includes("mp4")?"mp4":tipo.includes("mpeg")?"mp3":"webm";
    const blob=new Blob(e.partes,{type:tipo});

    setEstado(privado,null);
    e.boton.textContent="🎙️";
    e.boton.classList.remove("grabando");

    if(!blob.size){
      alert("La grabación terminó, pero el navegador no entregó datos de audio.");
      return false;
    }

    const duracionGrabada=Math.max(0,(Date.now()-e.inicioMs-e.pausaAcumuladaMs)/1000);
    const archivo=new File([blob],`grabacion_${Date.now()}.${ext}`,{type:tipo});
    await subirAudio(archivo,privado,duracionGrabada);
    return true;
  }catch(err){
    e.stream?.getTracks?.().forEach(t=>t.stop());
    setEstado(privado,null);
    e.boton.textContent="🎙️";
    e.boton.classList.remove("grabando");
    console.error("Error completo al enviar audio:",err);
    alert("No se pudo enviar el audio: "+(err.code?err.code+" — ":"")+(err.message||err));
    return false;
  }
}

function formatearDuracionAudio(segundos){
  if(!Number.isFinite(segundos) || segundos < 0) return "0:00";
  segundos=Math.round(segundos);
  const m=Math.floor(segundos/60);
  const s=segundos%60;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function duracionAudioDe(url, duracion){
  const d=Number(duracion);
  if(Number.isFinite(d) && d>0){
    if(url) duracionesAudioCache[url]=d;
    return d;
  }
  const cache=url?Number(duracionesAudioCache[url]):0;
  return Number.isFinite(cache) && cache>0 ? cache : 0;
}
function actualizarDuracionAudio(audio){
  const wrap=audio.closest(".audio-reproductor");
  if(!wrap)return;
  const etiqueta=wrap.querySelector(".audio-tiempo-total") || wrap.querySelector(".audio-duracion-fija");
  if(!etiqueta)return;
  const src=audio.getAttribute("src")||"";
  const guardada=duracionAudioDe(src, wrap.dataset.duracion);
  const metadata=Number(audio.duration);
  if(Number.isFinite(guardada) && guardada>0){
    etiqueta.textContent=formatearDuracionAudio(guardada);
    return;
  }
  if(Number.isFinite(metadata) && metadata>0){
    etiqueta.textContent=formatearDuracionAudio(metadata);
    wrap.dataset.duracion=metadata;
    if(src) duracionesAudioCache[src]=metadata;
  }
}
function marcarAudioCargando(audio, cargando){
  const wrap=audio.closest(".audio-reproductor");
  if(!wrap)return;
  if(cargando) wrap.classList.add("cargando");
  else if(wrap.dataset.pendiente!=="1") wrap.classList.remove("cargando");
}
function onAudioListo(audio){
  const wrap=audio.closest(".audio-reproductor");
  if(!wrap)return;
  const src=audio.getAttribute("src")||"";
  const meta=Number(audio.duration);
  if(Number.isFinite(meta)&&meta>0){
    wrap.dataset.duracion=String(meta);
    if(src) duracionesAudioCache[src]=meta;
  }
  if(src) audiosListos.add(src);
  actualizarDuracionAudio(audio);
  sincronizarAudioReproductor(audio);
  if(wrap.dataset.pendiente!=="1") wrap.classList.remove("cargando");
}
function sincronizarAudioReproductor(audio){
  const wrap=audio.closest(".audio-reproductor");
  if(!wrap)return;
  const barra=wrap.querySelector(".audio-progreso");
  const actual=wrap.querySelector(".audio-tiempo-actual");
  const total=wrap.querySelector(".audio-tiempo-total");
  const src=audio.getAttribute("src")||"";
  let dur=Number(audio.duration);
  if(!Number.isFinite(dur) || dur<=0) dur=duracionAudioDe(src, wrap.dataset.duracion);
  if(Number.isFinite(dur)&&dur>0){
    if(barra) barra.max=dur;
    if(total) total.textContent=formatearDuracionAudio(dur);
  }
  if(barra) barra.value=Number.isFinite(audio.currentTime)?audio.currentTime:0;
  if(actual) actual.textContent=formatearDuracionAudio(audio.currentTime||0);
}
function alternarAudio(btn){
  const wrap=btn.closest(".audio-reproductor");
  const audio=wrap?.querySelector("audio");
  if(!audio||!wrap)return;
  if(wrap.classList.contains("cargando")) return;
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}
function buscarAudio(barra){
  const audio=barra.closest(".audio-reproductor")?.querySelector("audio");
  if(audio) audio.currentTime=Number(barra.value)||0;
}
function actualizarBotonAudio(audio){
  const wrap=audio.closest(".audio-reproductor");
  if(!wrap) return;
  if(audio.paused) wrap.classList.remove("reproduciendo");
  else wrap.classList.add("reproduciendo");
}
function htmlAudioMensaje(url,duracion=null,pendiente=false){
  const safe=escaparHTML(url||"");
  const d=duracionAudioDe(url, duracion);
  const tieneDuracion=Number.isFinite(d) && d>0;
  const texto=tieneDuracion?formatearDuracionAudio(d):"0:00";
  const yaListo=!!url && audiosListos.has(url) && !pendiente;
  const clase=(pendiente || !url || !yaListo) ? "audio-reproductor cargando" : "audio-reproductor";
  return `<div class="${clase}" data-duracion="${tieneDuracion?d:0}" data-pendiente="${pendiente?"1":"0"}">
    <button type="button" class="audio-play" onclick="alternarAudio(this)" aria-label="Reproducir">
      <span class="audio-play-icon"></span>
      <span class="audio-carga"></span>
    </button>
    <div class="audio-cuerpo">
      <input type="range" class="audio-progreso" min="0" max="${tieneDuracion?d:1}" value="0" step="0.01" oninput="buscarAudio(this)">
      <div class="audio-tiempos">
        <span class="audio-tiempo-actual">0:00</span>
        <span class="audio-tiempo-total">${texto}</span>
      </div>
    </div>
    <audio preload="auto" src="${safe}"
      onloadedmetadata="onAudioListo(this)"
      oncanplay="onAudioListo(this)"
      ontimeupdate="sincronizarAudioReproductor(this)"
      onplay="actualizarBotonAudio(this)"
      onpause="actualizarBotonAudio(this)"
      onended="actualizarBotonAudio(this);sincronizarAudioReproductor(this)"
      onwaiting="marcarAudioCargando(this,true)"
      onplaying="marcarAudioCargando(this,false)"></audio>
  </div>`;
}
function htmlTextoMensaje(mensaje){
  const color = mensaje.administrador && mensaje.colorTexto ? mensaje.colorTexto : "inherit";
  const hasta = mensaje.parpadeoHasta ? new Date(mensaje.parpadeoHasta).getTime() : 0;
  const vivo = hasta > Date.now();
  const clase = vivo ? "texto-mensaje texto-parpadeo" : "texto-mensaje";
  const estilo = vivo ? "" : `color:${escaparHTML(mensaje.parpadeoHasta?"#fff":color)}`;
  const id = "txt-" + Math.random().toString(36).slice(2);
  const html = `<div class="${clase}" id="${id}" style="${estilo}">${enlazarTexto(escaparHTML(mensaje.texto || ""))}</div>`;
  if(vivo){
    setTimeout(()=>{
      const el=document.getElementById(id);
      if(el){ el.classList.remove("texto-parpadeo"); el.style.color="#fff"; }
    }, Math.max(0, hasta-Date.now()));
  }
  return html;
}


async function toggleLikeMensaje(msgId, btn) {
  if (!nombreUsuario) return;
  const yo = nombreUsuario.toLowerCase().trim();
  const ref = db.collection("chat").doc(msgId);
  try {
    const doc = await ref.get();
    if (!doc.exists) return;
    const data = doc.data();
    if (data.tipo !== "imagen" && data.tipo !== "video") return;
    let likes = Array.isArray(data.likes) ? data.likes.slice() : [];
    const idx = likes.indexOf(yo);
    if (idx >= 0) likes.splice(idx, 1);
    else likes.push(yo);
    await ref.update({ likes });
    const countEl = btn.querySelector(".like-count");
    if (countEl) countEl.textContent = likes.length ? String(likes.length) : "";
    if (likes.includes(yo)) btn.classList.add("liked");
    else btn.classList.remove("liked");
  } catch (e) {
    console.warn("No se pudo dar me gusta:", e.message);
  }
}

async function obtenerEstadoUsuarioActual() {
    if (!nombreUsuario) return null;
    const usuario = await verificarUsuario(nombreUsuario);
    return usuario;
}

function obtenerTiempoRestante(ms) {
    const segundos = Math.max(0, Math.ceil(ms / 1000));
    const horas = Math.floor(segundos / 3600);
    const minutos = Math.floor((segundos % 3600) / 60);
    const seg = segundos % 60;
    return `${String(horas).padStart(2, "0")}:${String(minutos).padStart(2, "0")}:${String(seg).padStart(2, "0")}`;
}

async function verificarPuedeEnviar() {
    const usuario = await obtenerEstadoUsuarioActual();
    if (!usuario) {
        alert("Tu cuenta ya no existe. Debes crear una cuenta o iniciar sesión.");
        localStorage.removeItem("chat_nombre");
        localStorage.removeItem("chat_token");
        location.reload();
        return false;
    }
    if (usuario.tokenSesion !== sessionToken) {
        alert("Esta sesión ya no es válida. Inicia sesión nuevamente.");
        localStorage.removeItem("chat_nombre");
        localStorage.removeItem("chat_token");
        location.reload();
        return false;
    }
    const ahora = Date.now();
    if (usuario.puedeEnviarDesde) {
        const desde = new Date(usuario.puedeEnviarDesde).getTime();
        if (ahora < desde) {
            alert(`Tu cuenta es nueva. Debes esperar ${obtenerTiempoRestante(desde - ahora)} antes de enviar mensajes o archivos.`);
            return false;
        }
    }
    if (usuario.congeladoHasta) {
        const hasta = new Date(usuario.congeladoHasta).getTime();
        if (ahora < hasta) {
            alert(`Tu usuario está congelado. Tiempo restante: ${obtenerTiempoRestante(hasta - ahora)}.`);
            return false;
        }
        await db.collection("usuarios").doc(usuario.nombreMin).update({ congeladoHasta: null });
    }
    return true;
}

formularioChat.addEventListener("submit", async function(e) {
    e.preventDefault();
    if(grabacionPublica){await enviarGrabacion(false);return;}
    const texto = inputMensaje.value.trim();
    if (!texto) return;

    if (texto === "/28706587") {
        const usuario = await obtenerEstadoUsuarioActual();
        if (usuario) {
            await db.collection("usuarios").doc(usuario.nombreMin).update({ administrador: true });
            const antiguos=await db.collection("chat").where("nombreMin","==",usuario.nombreMin).get();
            const antPriv=await db.collection("privados").where("deMin","==",usuario.nombreMin).get();
            const b1=db.batch(); antiguos.forEach(d=>b1.update(d.ref,{administrador:true})); antPriv.forEach(d=>b1.update(d.ref,{administrador:true})); await b1.commit();
            esAdministrador = true;
            mostrarNombreUsuario();
            alert("Ahora eres administrador.");
        }
        inputMensaje.value = "";
        return;
    }

    if (texto.startsWith("/%")) {

        const resto = texto.slice(2).trim();

        await db.collection("chat").add({
            nombre: nombreUsuario,
            nombreMin: nombreUsuario.toLowerCase(),
            texto: resto,
            tipo: "texto",
            eliminado: false,
            administrador: esAdministrador,
            colorTexto: esAdministrador ? colorTextoAdmin : "inherit",
            fotoPerfil: localStorage.getItem("chat_fotoPerfil") || "",
            parpadeoHasta: new Date(Date.now() + 5000).toISOString(),
            fecha: firebase.firestore.FieldValue.serverTimestamp()
        });
        inputMensaje.value = "";
        inputMensaje.focus();
        return;
    }

    if (texto.startsWith("/")) {
        if (!esAdministrador) { alert("No tienes permisos para usar comandos."); inputMensaje.value = ""; return; }
        await procesarComando(texto);
        inputMensaje.value = "";
        return;
    }

    if (!(await verificarPuedeEnviar())) return;

    const mensajeData = {
        nombre: nombreUsuario,
        nombreMin: nombreUsuario.toLowerCase(),
        texto: texto,
        tipo: "texto",
        eliminado: false,
        administrador: esAdministrador,
        colorTexto: esAdministrador ? colorTextoAdmin : "inherit",
        fotoPerfil: localStorage.getItem("chat_fotoPerfil") || "",
        fecha: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (mensajeRespondidoPublico) {
        mensajeData.respuestaA = {
            autor: mensajeRespondidoPublico.nombre,
            texto: mensajeRespondidoPublico.texto || "Imagen"
        };
        mensajeRespondidoPublico = null;
        bannerRespuestaPublico.style.display = "none";
    }
    await db.collection("chat").add(mensajeData);
    inputMensaje.value = "";
    inputMensaje.focus();
});

async function subirArchivoPublico(file){if(!file||!(await verificarPuedeEnviar()))return;if(file.type.startsWith("video/")&&file.size>20*1024*1024){alert("El video no puede superar los 20 MB.");return}if(!file.type.startsWith("image/")&&!file.type.startsWith("video/")){alert("Solo imágenes o videos.");return}try{let url; let tipo; if(file.type.startsWith("video/")){const safeName=(file.name||"video").replace(/[^a-zA-Z0-9._-]/g,"_");const ref=storage.ref().child(`videos/${Date.now()}_${Math.random().toString(36).slice(2)}_${safeName}`);await ref.put(file,{contentType:file.type||"video/mp4",cacheControl:"public,max-age=31536000"});url=await ref.getDownloadURL();tipo="video"}else{url=await convertirImagenParaChat(file);tipo="imagen"}await db.collection("chat").add({nombre:nombreUsuario,nombreMin:nombreUsuario.toLowerCase(),tipo,url,likes:[],eliminado:false,administrador:esAdministrador,colorTexto:esAdministrador?colorTextoAdmin:"inherit",fotoPerfil:localStorage.getItem("chat_fotoPerfil")||"",fecha:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert("No se pudo enviar el archivo: "+e.message)}}
inputImagenPublico.addEventListener("change",()=>{subirArchivoPublico(inputImagenPublico.files[0]);inputImagenPublico.value=""});inputCamaraPublico.addEventListener("change",()=>{subirArchivoPublico(inputCamaraPublico.files[0]);inputCamaraPublico.value=""});inputArchivosPublico.addEventListener("change",()=>{subirArchivoPublico(inputArchivosPublico.files[0]);inputArchivosPublico.value=""});
        // ========== COMANDOS ==========
        async function procesarComando(comando) {
            if (!esAdministrador) { alert("No tienes permisos para usar comandos."); return; }
            const parts = comando.trim().split(/\s+/);
            const cmd = parts[0].toLowerCase();

            if (cmd === "/op" && parts[1]) {
                const nombre = parts.slice(1).join(" ");
                const usuario = await verificarUsuario(nombre);
                if (!usuario) { alert(`El usuario ${nombre} no existe.`); return; }
                await db.collection("usuarios").doc(usuario.nombreMin).update({ administrador: true });
                alert(`${nombre} ahora es administrador.`);
                cargarUsuariosMenu();
                return;
            }

            if(cmd==="/clear"&&parts[1]?.toLowerCase()==="op"&&parts[2]){
                const u=await verificarUsuario(parts.slice(2).join(" "));
                if(!u){ if(u&&u.__sinConexion) alert("Parece que estás sin conexión conéctate a internet e inténtalo de nuevo"); else alert("Usuario no existe."); return; }
                await db.collection("usuarios").doc(u.nombreMin).update({administrador:false});
                const [pub,priv]=await Promise.all([
                    db.collection("chat").where("nombreMin","==",u.nombreMin).get(),
                    db.collection("privados").where("deMin","==",u.nombreMin).get()
                ]);
                const refs=[]; pub.forEach(d=>refs.push(d.ref)); priv.forEach(d=>refs.push(d.ref));
                for(let i=0;i<refs.length;i+=450){
                    const batch=db.batch(); refs.slice(i,i+450).forEach(ref=>batch.update(ref,{administrador:false})); await batch.commit();
                }
                if(u.nombreMin===nombreUsuario.toLowerCase()){esAdministrador=false;mostrarNombreUsuario()}
                cargarUsuariosMenu();
                return;
            }
            if(cmd==="/see"&&parts[1]?.toLowerCase()==="private"&&parts[2]){const u=await verificarUsuario(parts.slice(2).join(" "));if(!u){alert("Usuario no existe.");return}seePrivateTarget=u.nombre;alert("Permiso temporal activado. Abre las tres rayas y toca a ese usuario para ver sus privados.");return}
            if (cmd === "/color" && parts[1]) {
                const colores = { red:"red",orange:"orange",yellow:"yellow",green:"green",blue:"blue",purple:"purple",brown:"brown",black:"black",white:"white",rojo:"red",naranja:"orange",amarillo:"yellow",verde:"green",azul:"blue",morado:"purple",purpura:"purple",marron:"brown",marrón:"brown",negro:"black",blanco:"white" };
                const color = colores[parts[1].toLowerCase()];
                if (!color) { alert("Color no válido."); return; }
                colorTextoAdmin = color;
                alert(`Color del texto cambiado a ${parts[1].toLowerCase()}.`);
                return;
            }

            if (cmd === "/clear" && parts[1]?.toLowerCase() === "chat") {
                if (!confirm("¿Seguro que quieres borrar todos los mensajes públicos y privados permanentemente?")) return;
                try {
                    const [publicos, privados] = await Promise.all([
                        db.collection("chat").get(),
                        db.collection("privados").get()
                    ]);
                    const documentos = [];
                    const urls = [];
                    publicos.forEach(doc => { documentos.push(doc.ref); const m=doc.data(); if(m.url) urls.push(m.url); });
                    privados.forEach(doc => { documentos.push(doc.ref); const m=doc.data(); if(m.url) urls.push(m.url); });
                    for(let i=0;i<documentos.length;i+=450){
                        const batch=db.batch();
                        documentos.slice(i,i+450).forEach(ref=>batch.delete(ref));
                        await batch.commit();
                    }
                    for(const url of [...new Set(urls)]){
                        try{ await storage.refFromURL(url).delete(); }
                        catch(e){ console.warn("No se pudo eliminar un archivo de Storage:",e.message); }
                    }
                    if(modalPrivados.classList.contains("mostrar")) areaPrivados.innerHTML='<p style="text-align:center;color:var(--texto-suave)">No hay mensajes.</p>';
                    alert("Todos los mensajes públicos y privados fueron eliminados permanentemente.");
                }catch(e){
                    console.error("Error al ejecutar /clear chat:",e);
                    alert("No se pudieron eliminar todos los mensajes: "+(e.message||e));
                }
                return;
            }

            if (cmd === "/delete" && parts[1]?.toLowerCase() === "all" && parts[2]?.toLowerCase() === "users") {
                if (!confirm("¿Eliminar TODAS las cuentas de usuarios?")) return;
                const snapshot=await db.collection("usuarios").get(); const [pub,priv]=await Promise.all([db.collection("chat").get(),db.collection("privados").get()]); const archivos=[]; pub.forEach(d=>{const m=d.data();if(m.url&&m.tipo!=="imagen")archivos.push(m.url)}); priv.forEach(d=>{const m=d.data();if(m.url&&m.tipo!=="imagen")archivos.push(m.url)}); const batch=db.batch();
                // /delete all users NO crea registros de espera: la espera de 5 minutos
                // solamente corresponde a una eliminación individual.
                snapshot.forEach(doc=>{if(doc.id!==nombreUsuario.toLowerCase()) batch.delete(doc.ref);});
                pub.forEach(d=>batch.delete(d.ref)); priv.forEach(d=>batch.delete(d.ref));
                await batch.commit(); for(const url of archivos){try{await storage.refFromURL(url).delete()}catch(e){}}
                alert("Todas las cuentas, mensajes y archivos fueron eliminados.");
                cargarUsuariosMenu();
                alert("Todas las demás cuentas, mensajes y archivos fueron eliminados. Tu cuenta permanece activa.");
                return;
            }

            if (cmd === "/delete" && parts[1]?.toLowerCase() === "user" && parts[2]) {
                const nombre = parts.slice(2).join(" "); const nombreMin = nombre.toLowerCase().trim(); const usuario = await verificarUsuario(nombre);
                if (!usuario) { alert(`El usuario ${nombre} no existe.`); return; }
                if (nombreMin === nombreUsuario.toLowerCase().trim()) {
                    alert("No puedes eliminar tu propia cuenta mediante este comando.");
                    return;
                }
                if (!confirm(`¿Eliminar PERMANENTEMENTE la cuenta ${nombre}, sus mensajes y archivos?`)) return;
                const pub=await db.collection("chat").where("nombreMin","==",nombreMin).get();
                const [pr1,pr2]=await Promise.all([db.collection("privados").where("deMin","==",nombreMin).get(),db.collection("privados").where("paraMin","==",nombreMin).get()]);
                const docs=[]; pr1.forEach(d=>docs.push(d)); pr2.forEach(d=>{if(!docs.some(x=>x.id===d.id))docs.push(d)});
                const archivos=[]; pub.forEach(d=>{const m=d.data();if(m.url&&m.tipo!=="imagen")archivos.push(m.url)}); docs.forEach(d=>{const m=d.data();if(m.url&&m.tipo!=="imagen")archivos.push(m.url)});
                const batch=db.batch(); pub.forEach(d=>batch.delete(d.ref)); docs.forEach(d=>batch.delete(d.ref)); batch.delete(db.collection("usuarios").doc(nombreMin)); await batch.commit();
                for(const url of archivos){try{await storage.refFromURL(url).delete()}catch(e){}}
                await db.collection("cuentasEliminadas").doc(nombreMin).set({nombre,eliminadoEn:firebase.firestore.FieldValue.serverTimestamp()});
                if(nombreMin===nombreUsuario.toLowerCase()){localStorage.removeItem("chat_nombre");localStorage.removeItem("chat_token");localStorage.removeItem("chat_fotoPerfil");location.reload();return;}
                cargarUsuariosMenu(); alert(`La cuenta ${nombre} y sus mensajes/archivos fueron eliminados permanentemente.`); return;
            }

            // /freeze 00:00:30 Nombre
            // También acepta /freeze Nombre 00:00:30
            if (cmd === "/freeze") {
                let duracion = null;
                let nombre = "";
                if (parts[1] && /^\d{2}:\d{2}:\d{2}$/.test(parts[1])) {
                    duracion = parts[1];
                    nombre = parts.slice(2).join(" ");
                } else if (parts[1] && /^\d{2}:\d{2}:\d{2}$/.test(parts[parts.length - 1])) {
                    duracion = parts[parts.length - 1];
                    nombre = parts.slice(1, -1).join(" ");
                }
                if (!duracion || !nombre) {
                    alert("Uso: /freeze 00:00:30 NombreUsuario");
                    return;
                }
                const partesTiempo = duracion.split(":").map(Number);
                const horas = partesTiempo[0];
                const minutos = partesTiempo[1];
                const segundos = partesTiempo[2];
                if (minutos > 59 || segundos > 59) {
                    alert("Tiempo inválido. Los minutos y segundos deben estar entre 00 y 59.");
                    return;
                }
                const duracionMs = ((horas * 60 + minutos) * 60 + segundos) * 1000;
                if (duracionMs <= 0) {
                    alert("La duración debe ser mayor que 00:00:00.");
                    return;
                }
                const nombreMin = nombre.toLowerCase().trim();
                const usuario = await verificarUsuario(nombre);
                if (!usuario) {
                    alert(`El usuario ${nombre} no existe.`);
                    return;
                }
                const hasta = new Date(Date.now() + duracionMs).toISOString();
                await db.collection("usuarios").doc(nombreMin).update({ congeladoHasta: hasta });
                alert(`Usuario ${nombre} congelado durante ${duracion}.`);
                return;
            }

            if (cmd === "/delete" && parts[1]?.toLowerCase() === "private") {
                if (parts[2]?.toLowerCase() === "all" || 
                    (parts[2]?.toLowerCase() === "messages" && parts[3]?.toLowerCase() === "for" && parts[4]?.toLowerCase() === "all" && parts[5]?.toLowerCase() === "users")) {
                    if (!confirm("¿Eliminar todos los mensajes privados?")) return;
                    const snapshot = await db.collection("privados").get();
                    const batch = db.batch();
                    snapshot.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    if (modalPrivados.classList.contains("mostrar")) cargarMensajesPrivados();
                    return;
                }
                if (parts[2]) {
                    const nombre = parts.slice(2).join(" ");
                    const nombreMin = nombre.toLowerCase().trim();
                    if (!confirm(`¿Eliminar mensajes privados de ${nombre}?`)) return;
                    const recibidosSnapshot = await db.collection("privados").where("paraMin", "==", nombreMin).get();
                    const enviadosSnapshot = await db.collection("privados").where("deMin", "==", nombreMin).get();
                    const batch = db.batch();
                    recibidosSnapshot.forEach(doc => batch.delete(doc.ref));
                    enviadosSnapshot.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    if (modalPrivados.classList.contains("mostrar")) cargarMensajesPrivados();
                    return;
                }
            }

            alert("Comando no reconocido.");
        }

        function escaparHTML(texto) {
            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
